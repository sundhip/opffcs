# Ingestion schema mappings for VIT FFCS Excel files

files:
  subject_teachers_slots_reviews_corrected_v2.xlsx:
    description: "Curated semester course offerings with faculty, slots, timings, and reviews"
    sheet_mode: "per_course" # Each sheet is one course
    has_header: true
    header_row: 1
    columns:
      course_code: "Course Code"
      course_title: "Subject"
      faculty_name: "Teacher Name"
      theory_slot: "Theory Slot"
      theory_day: "Theory Day"
      theory_timing: "Theory Timing"
      lab_slot: "Lab Slot"
      lab_day: "Lab Day"
      lab_timing: "Lab Timing"
      review: "Reviews / Ratings"
      venue: null

  ffcs__4__1_.xlsx:
    description: "Master curriculum export with Batch 2025 catalog and draft course offering sheets"
    sheet_mode: "mixed"
    has_header: true
    header_row: 1
    sheets:
